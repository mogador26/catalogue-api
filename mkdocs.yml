---
# ---------------------------------------------------------------------------
# Catalogue des API - Ministère de l'Intérieur (DNUM)
# Thème : mkdocs-dsfr 0.26.1 (DSFR 1.15.2)
# ---------------------------------------------------------------------------

site_name: Catalogue des API
site_description: >-
  Le catalogue des interfaces de programmation applicative (API) exposées par la
  direction du numérique. Description fonctionnelle, cas d'usage, modalités
  d'accès, documentation OpenAPI et contacts des producteurs.
site_url: https://catalogue-api.exemple.gouv.fr/
site_author: Direction du numérique
copyright: Direction du numérique - Licence Ouverte 2.0

repo_url: https://github.com/mogador26/catalogue-api
edit_uri: blob/main/docs/

docs_dir: docs
site_dir: site
strict: false

# ---------------------------------------------------------------------------
# Thème
# ---------------------------------------------------------------------------
theme:
  name: dsfr

  include_search_page: true
  afficher_date_de_revision: true
  # Le menu latéral natif est désactivé : la colonne de gauche est occupée
  # par le panneau de thèmes et de filtres du catalogue.
  afficher_menu_lateral: false
  afficher_bouton_editer: true
  afficher_sommaire: false 
  bouton_hautdepage: left
  libelle_bouton_editer: Proposer une modification

  # Bloc marque « République française » (Marianne) affiché en haut à gauche
  intitule: "République <br> française"

  header:
    titre: "Catalogue des API"
    sous_titre: "Direction du numérique"
    links:
      - name: "Catalogue"
        url: ""
        icon: "apps-line"
      - name: "Feuille de route"
        url: "feuille-de-route/"
        icon: "road-map-line"
      - name: "Publier une API"
        url: "publier-une-api/"
        icon: "add-circle-line"
      - name: "Code source"
        url: "https://github.com/mogador26/catalogue-api"
        icon: "github-fill"

  footer:
    description: >-
      Le catalogue des API recense les interfaces de programmation exposées par
      la direction du numérique à ses partenaires internes et externes. Sauf
      mention contraire, les contenus de ce site sont proposés sous
      Licence Ouverte 2.0.
    # Liens de bas de page à droite : références aux sites gouvernementaux.
    links:
      - name: legifrance.gouv.fr
        url: https://www.legifrance.gouv.fr
      - name: info.gouv.fr
        url: https://www.info.gouv.fr
      - name: service-public.fr
        url: https://www.service-public.fr
      - name: data.gouv.fr
        url: https://www.data.gouv.fr
      - name: api.gouv.fr
        url: https://www.data.gouv.fr/dataservices
    # Liens de bas de page à gauche : mention d'accessibilité en premier.
    bottom_links:
      - name: "Accessibilité : partiellement conforme"
        url: "accessibilite/"
        icon: "accessibility-line"
      - name: "Mentions légales"
        url: "mentions-legales/"
      - name: "Données personnelles"
        url: "donnees-personnelles/"
      - name: "Gestion des cookies"
        url: "donnees-personnelles/#cookies"
      - name: "Code source"
        url: "https://github.com/dnum-mi/referentiel-applications"

# ---------------------------------------------------------------------------
# Plugins (search, open-in-new-tab, tags_index et dsfr_base sont requis
# par le thème mkdocs-dsfr)
# ---------------------------------------------------------------------------
plugins:
  - search:
      lang: fr
  - tags_index
  - dsfr_base
  - document_dates:
      position: bottom

# Le hook construit le catalogue, les compteurs, les filtres, la feuille de
# route et les conteneurs Redoc à partir des en-têtes YAML des fiches API.
hooks:
  - hooks/catalogue.py

# ---------------------------------------------------------------------------
# Extensions Markdown
# ---------------------------------------------------------------------------
markdown_extensions:
  - meta
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 2
  - dsfr_structure.extension.all_extensions

extra_css:
  - assets/stylesheets/catalogue.css

extra_javascript:
  - assets/javascripts/catalogue.js
  - assets/javascripts/redoc-loader.js

extra:
  # Version de Redoc chargée si le bundle local est absent.
  redoc_version: "2.5.0"

# ---------------------------------------------------------------------------
# Navigation
# ---------------------------------------------------------------------------
nav:
  - Catalogue: index.md
  - Feuille de route: feuille-de-route.md
  - API:
      - Référentiel des applications: ./apis/referentiel-applications.md
      - Immatriculation des véhicules: ./apis/immatriculation-vehicules.md
      - Détention d'armes (SIA): ./apis/detention-armes.md
      - Répertoire national des associations: ./apis/repertoire-associations.md
      - Entreprises et établissements: ./apis/entreprises-etablissements.md
      - Subventions et concours financiers: ./apis/subventions.md
      - Sollicitations de support: ./apis/support-sollicitations.md
      - Notifications transactionnelles: ./apis/notifications.md
      - Identités et habilitations: ./apis/identites-habilitations.md
      - Référentiel géographique: ./apis/referentiel-geographique.md
  - Publier une API: publier-une-api.md
  - Mots-clés: tags_index.md  
